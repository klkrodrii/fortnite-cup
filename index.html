<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>KUSH – Bando Staff</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto&display=swap');

body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: radial-gradient(circle at top left, #4b0000, #090000);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  padding: 30px;
  background: rgba(20,0,0,0.92);
  border-radius: 16px;
  box-shadow: 0 0 35px #ff1a1a, 0 0 80px rgba(255,255,255,0.18);
  overflow-y: auto;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  font-size: 2rem;
  background: linear-gradient(90deg, #ff1a1a, #ffffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  text-align: center;
  margin-bottom: 25px;
  color: #ffd6d6;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
  font-size: 14px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: #fff;
  box-sizing: border-box;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

select option {
  color: black;
}

button {
  margin-top: 28px;
  width: 100%;
  height: 50px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(90deg, #ff1a1a, #ffffff);
  color: #290000;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  text-transform: uppercase;
  box-shadow: 0 0 25px rgba(255,26,26,0.7);
}

button:hover {
  transform: scale(1.05);
}

.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  opacity: 0.5;
}

.success {
  display: none;
  text-align: center;
}

.success-icon {
  font-size: 3.5rem;
  margin-bottom: 15px;
}

.success h2 {
  font-family: 'Orbitron', sans-serif;
  background: linear-gradient(90deg, #ff1a1a, #ffffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.success a {
  display: inline-block;
  margin-top: 22px;
  padding: 14px 26px;
  border-radius: 14px;
  background: linear-gradient(90deg, #5865F2, #8EA1E1);
  color: white;
  font-weight: bold;
  text-decoration: none;
}

#loader {
  display: none;
  border: 4px solid rgba(255,255,255,0.1);
  border-top: 4px solid #ff1a1a;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  animation: spin 1s linear infinite;
  margin: 22px auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="container">

  <div id="formBox">
    <h1>KUSH</h1>
    <p class="subtitle">Modulo ufficiale bando staff</p>

    <form id="staffForm">

      <label>Nome reale</label>
      <input type="text" name="nome" required>

      <label>Nome Discord</label>
      <input type="text" name="discord" placeholder="@Utente" required>

      <label>Età</label>
      <input type="number" name="eta" min="14" required>

      <label>Esperienza Staff</label>
      <textarea name="esperienza" required placeholder="Scrivi qui la tua esperienza..."></textarea>

      <label>Perché vuoi entrare nello staff di KUSH?</label>
      <textarea name="motivazione" required placeholder="Spiega qui la tua motivazione..."></textarea>

      <label>Disponibilità</label>
      <select name="disponibilita" required>
        <option>1-2 ore</option>
        <option>2-4 ore</option>
        <option>4+ ore</option>
        <option>Weekend</option>
      </select>

      <button type="submit">Invia candidatura</button>

    </form>

    <div id="loader"></div>
    <p class="footer">© KUSH</p>
  </div>

  <div id="successBox" class="success">
    <div class="success-icon">✅</div>
    <h2>Candidatura inviata!</h2>
    <p>La tua candidatura staff è stata inviata correttamente.</p>
    <p>Entra nel Discord di KUSH.</p>
    <a href="https://dsc.gg/kushgg" target="_blank">Entra nel Discord</a>
  </div>

</div>

<script>
const webhookURL = "https://discord.com/api/webhooks/1506916922090848266/EAJASVoc5VlYO_q-6AdPn-d30dvyk0fVo4GNmP8rwhqlLdbBYxkttkaN7nB17dJKxDFt";

document.getElementById("staffForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const f = new FormData(e.target);
  const discord = f.get("discord");

  const invii = JSON.parse(localStorage.getItem("inviiStaffKush") || "[]");

  if (invii.includes(discord)) {
    alert("Hai già inviato una candidatura con questo Discord!");
    return;
  }

  document.getElementById("loader").style.display = "block";

  const embed = {
    title: "🔥 NUOVA CANDIDATURA STAFF – KUSH",
    color: 0xff1a1a,
    fields: [
      {
        name: "👤 Informazioni candidato",
        value:
`**Nome:** ${f.get("nome")}
**Discord:** ${discord}
**Età:** ${f.get("eta")}`
      },
      {
        name: "⏰ Disponibilità",
        value: f.get("disponibilita")
      },
      {
        name: "📚 Esperienza Staff",
        value: f.get("esperienza")
      },
      {
        name: "💬 Motivazione",
        value: f.get("motivazione")
      }
    ],
    footer: {
      text: "KUSH Staff System"
    },
    timestamp: new Date().toISOString()
  };

  fetch(webhookURL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      embeds: [embed]
    })
  })
  .then(response => {
    if (!response.ok) {
      throw new Error("Errore webhook");
    }

    invii.push(discord);
    localStorage.setItem("inviiStaffKush", JSON.stringify(invii));

    document.getElementById("formBox").style.display = "none";
    document.getElementById("successBox").style.display = "block";
    document.getElementById("loader").style.display = "none";
  })
  .catch(() => {
    alert("Errore durante l'invio. Controlla il webhook Discord.");
    document.getElementById("loader").style.display = "none";
  });
});
</script>

</body>
</html>
