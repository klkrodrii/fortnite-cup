<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandi Staff</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  height:100vh;
  background:linear-gradient(-45deg,#0a0a0f,#1a1a2e,#121224,#0f0f0f);
  background-size:400% 400%;
  animation:gradientBG 12s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

@keyframes gradientBG{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.box{
  width:420px;
  padding:35px;
  border-radius:25px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(25px);
  box-shadow:0 0 60px rgba(0,0,0,0.8);
  border:1px solid rgba(255,255,255,0.08);
  text-align:center;
}

.logo{
  max-width:180px;
  margin:0 auto 15px auto;
  display:block;
  filter:drop-shadow(0 0 15px rgba(122,132,255,0.6));
}

h2{margin-bottom:20px;}

input,textarea{
  width:100%;
  margin-top:14px;
  padding:14px;
  border-radius:12px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.07);
  color:white;
  transition:0.25s;
  text-align:center;
  font-size:14px;
}

input::placeholder,textarea::placeholder{
  text-align:center;
}

textarea{
  resize:none;
  height:90px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

input:focus,textarea:focus{
  background:rgba(255,255,255,0.14);
  transform:scale(1.03);
  box-shadow:0 0 10px rgba(122,132,255,0.4);
}

button{
  margin-top:20px;
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,#ff8c00,#ffb347);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 25px rgba(255,140,0,0.5);
  display:flex;
  justify-content:center;
  align-items:center;
}

button:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 0 40px rgba(255,140,0,0.8);
}

.loader{
  width:18px;height:18px;
  border:3px solid rgba(255,255,255,0.3);
  border-top:3px solid white;
  border-radius:50%;
  animation:spin 1s linear infinite;
  display:none;
}

@keyframes spin{to{transform:rotate(360deg);}}

.success,.error{
  margin-top:12px;
  display:none;
  font-size:14px;
}

.success{color:#7CFFB2;}
.error{color:#ff6b6b;}

.progress-bar{
  width:0%;
  height:4px;
  background:#ff8c00;
  margin-top:10px;
  border-radius:10px;
  transition:width 0.3s;
}
</style>
</head>

<body>

<div class="box">

<img class="logo" src="">

<h2>BANDI STAFF</h2>

<form id="staffForm">

  <input type="text" id="nome" placeholder="👤 Nome" required>
  <input type="number" id="eta" placeholder="🎂 Età (min 14)" required>

  <textarea id="disp" placeholder="⏰ Disponibilità" required></textarea>

  <textarea id="azione" placeholder="🔥 Cosa faresti" required></textarea>

  <button type="submit">
    <span id="btnText">Invia candidatura</span>
    <div class="loader" id="loader"></div>
  </button>

  <div class="progress-bar" id="progressBar"></div>

  <div class="success" id="successMsg">✅ Candidatura inviata!</div>
  <div class="error" id="errorMsg">❌ Errore</div>

</form>

</div>

  }

  },100);

      {name:"Nome",value:nome},

</script>

</body>
</html>
