<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>KUSH – Bando Staff</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto&display=swap');

body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: radial-gradient(circle at top left, #4b0000, #090000);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  padding: 30px;
  background: rgba(20,0,0,0.92);
  border-radius: 16px;
  box-shadow: 0 0 35px #ff1a1a, 0 0 80px rgba(255,255,255,0.18);
  overflow-y: auto;
  animation: fadeIn 0.8s ease-out;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  font-size: 2rem;
  background: linear-gradient(90deg, #ff1a1a, #ffffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
  animation: glow 2s ease-in-out infinite alternate;
}

.subtitle {
  text-align: center;
  margin-bottom: 25px;
  color: #ffd6d6;
}

form label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
  font-size: 14px;
}

form input,
form select,
form textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: #fff;
  box-sizing: border-box;
}

form textarea {
  min-height: 90px;
  resize: vertical;
}

form select option {
  color: black;
}

form input:focus,
form select:focus,
form textarea:focus {
  box-shadow: 0 0 12px #ff1a1a;
  background: rgba(255,255,255,0.13);
}

.box {
  background: rgba(0,0,0,0.35);
  padding: 15px;
  border-radius: 12px;
  margin-top: 20px;
  border: 1px solid rgba(255,255,255,0.45);
}

.box strong {
  color: #ff4d4d;
}

.box label {
  font-weight: normal;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}

.box input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #ff1a1a;
}

button {
  margin-top: 28px;
  width: 100%;
  height: 50px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(90deg, #ff1a1a, #ffffff);
  color: #290000;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  text-transform: uppercase;
  box-shadow: 0 0 25px rgba(255,26,26,0.7);
  transition: 0.25s;
}

button:hover {
  transform: scale(1.05);
}

.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  opacity: 0.5;
}

.success {
  display: none;
  text-align: center;
}

.success-icon {
  font-size: 3.5rem;
  margin-bottom: 15px;
  animation: pop 0.6s ease-out;
}

.success h2 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.8rem;
  background: linear-gradient(90deg, #ff1a1a, #ffffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.success p {
  color: #ffe1e1;
}

.success a {
  display: inline-block;
  margin-top: 22px;
  padding: 14px 26px;
  border-radius: 14px;
  background: linear-gradient(90deg, #5865F2, #8EA1E1);
  color: white;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 0 25px rgba(88,101,242,0.8);
  transition: 0.25s;
}

.success a:hover {
  transform: scale(1.08);
}

#loader {
  display: none;
  border: 4px solid rgba(255,255,255,0.1);
  border-top: 4px solid #ff1a1a;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  animation: spin 1s linear infinite;
  margin: 22px auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes glow {
  from {
    text-shadow: 0 0 8px #ff1a1a;
  }
  to {
    text-shadow: 0 0 22px #ffffff;
  }
}

@keyframes pop {
  from {
    transform: scale(0.6);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
</style>
</head>

<body>

<div class="container">

  <div id="formBox">
    <h1>KUSH</h1>
    <p class="subtitle">Modulo ufficiale bando staff</p>

    <form id="staffForm">

      <label>Nome reale</label>
      <input type="text" name="nome" required>

      <label>Nome Discord</label>
      <input type="text" name="discord" placeholder="@Utente" required>

      <label>Età</label>
      <input type="number" name="eta" min="14" required>

      <label>Esperienza Staff</label>
      <textarea name="esperienza" required placeholder="Scrivi qui la tua esperienza..."></textarea>

      <label>Perché vuoi entrare nello staff di KUSH?</label>
      <textarea name="motivazione" required placeholder="Spiega qui la tua motivazione..."></textarea>

      <label>Disponibilità</label>
      <select name="disponibilita" required>
        <option>1-2 ore</option>
        <option>2-4 ore</option>
        <option>4+ ore</option>
        <option>Weekend</option>
      </select>

      <div class="box">
        <label>
          Conosco il regolamento RP
          <input type="checkbox" name="regolamento" required>
        </label>

        <label>
          So gestire ticket/player
          <input type="checkbox" name="ticket" required>
        </label>

        <label>
          Sono serio e disponibile
          <input type="checkbox" name="serio" required>
        </label>
      </div>

      <button type="submit">Invia candidatura</button>

    </form>

    <div id="loader"></div>

    <p class="footer">© KUSH</p>
  </div>

  <div id="successBox" class="success">

    <div class="success-icon">✅</div>

    <h2>Candidatura inviata!</h2>

    <p>La tua candidatura staff è stata inviata correttamente.</p>

    <p>Entra nel Discord di KUSH.</p>

    <a href="https://dsc.gg/kushgg" target="_blank">
      👉 Entra nel Discord
    </a>

  </div>

</div>

<script>

const webhookURL = "https://discord.com/api/webhooks/1506916922090848266/EAJASVoc5VlYO_q-6AdPn-d30dvyk0fVo4GNmP8rwhqlLdbBYxkttkaN7nB17dJKxDFt";

document.getElementById("staffForm").addEventListener("submit", function(e) {

  e.preventDefault();

  const f = new FormData(e.target);

  if (f.get("firma").toUpperCase() !== "ACCETTO REGOLE KUSH") {
    alert('Devi scrivere "ACCETTO REGOLE KUSH"');
    return;
  }

  const discord = f.get("discord");

  const invii = JSON.parse(localStorage.getItem("inviiStaffKush") || "[]");

  if (invii.includes(discord)) {
    alert("Hai già inviato una candidatura con questo Discord!");
    return;
  }

  document.getElementById("loader").style.display = "block";

  const embed = {

    title: "🔥 NUOVA CANDIDATURA STAFF – KUSH RP",

    color: 0xff1a1a,

    fields: [

      {
        name: "👤 Informazioni candidato",
        value:
`**Nome:** ${f.get("nome")}
**Discord:** ${discord}
**Età:** ${f.get("eta")}
**Nome IG:** ${f.get("ingame")}
**FiveM/Steam:** ${f.get("fivem")}`
      },

      {
        name: "🛡️ Ruolo richiesto",
        value:
`**Ruolo:** ${f.get("ruolo")}
**Disponibilità:** ${f.get("disponibilita")}`
      },

      {
        name: "📚 Esperienza Staff",
        value: f.get("esperienza")
      },

      {
        name: "💬 Motivazione",
        value: f.get("motivazione")
      },

      {
        name: "✅ Conferme",
        value:
`${f.get("regolamento") ? "🟢 Regolamento RP confermato" : "🔴 NO"}
${f.get("ticket") ? "🟢 Gestione ticket confermata" : "🔴 NO"}
${f.get("serio") ? "🟢 Serietà confermata" : "🔴 NO"}`
      },

      {
        name: "✍️ Firma digitale",
        value: `\`${f.get("firma")}\``
      }

    ],

    footer: {
      text: "KUSH RP Staff System"
    },

    timestamp: new Date()

  };

  fetch(webhookURL, {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      embeds: [embed]
    })

  })

  .then(() => {

    invii.push(discord);

    localStorage.setItem("inviiStaffKush", JSON.stringify(invii));

    document.getElementById("formBox").style.display = "none";

    document.getElementById("successBox").style.display = "block";

    document.getElementById("loader").style.display = "none";

  })

  .catch(() => {

    alert("Errore durante l'invio.");

    document.getElementById("loader").style.display = "none";

  });

});

</script>

</body>
</html>
