<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Thebes Cup – Iscrizione</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto&display=swap');

/* BODY */
body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: radial-gradient(circle at top left, #0f2b1d, #050b08);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

/* CONTAINER */
.container {
  width: 100%;
  max-width: 450px;
  max-height: 90vh;
  padding: 30px;
  background: rgba(5,20,12,0.9);
  border-radius: 16px;
  box-shadow: 0 0 35px #00ff88, 0 0 80px rgba(0,255,136,0.35);
  overflow-y: auto;
  animation: fadeIn 0.8s ease-out;
}

/* TITOLI */
h1 {
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  font-size: 2rem;
  background: linear-gradient(90deg, #00ff88, #00ffaa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
  animation: glow 2s ease-in-out infinite alternate;
}

.subtitle {
  text-align: center;
  margin-bottom: 25px;
  color: #9ddfc1;
}

/* FORM */
form label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
  font-size: 14px;
}

form input,
form select {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.06);
  color: #fff;
  box-sizing: border-box;
}

form select option {
  color: black;
}

form input:focus,
form select:focus {
  box-shadow: 0 0 12px #00ff88;
  background: rgba(255,255,255,0.1);
}

/* BOX STREAMING */
.box {
  background: rgba(0,0,0,0.35);
  padding: 15px;
  border-radius: 12px;
  margin-top: 20px;
  border: 1px solid rgba(0,255,136,0.6);
}

.box strong {
  color: #00ff88;
}

.box label {
  font-weight: normal;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}

.box input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #00ff88;
}

/* BUTTON */
button {
  margin-top: 28px;
  width: 100%;
  height: 50px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(90deg, #00ff88, #00ffaa);
  color: #002b1b;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  text-transform: uppercase;
  box-shadow: 0 0 25px rgba(0,255,136,0.7);
  transition: 0.25s;
}

button:hover {
  transform: scale(1.05);
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  opacity: 0.5;
}

/* SUCCESS */
.success {
  display: none;
  text-align: center;
}

.success-icon {
  font-size: 3.5rem;
  margin-bottom: 15px;
  animation: pop 0.6s ease-out;
}

.success h2 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.8rem;
  background: linear-gradient(90deg, #00ff88, #00ffaa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.success p {
  color: #cfeee0;
}

.success a {
  display: inline-block;
  margin-top: 22px;
  padding: 14px 26px;
  border-radius: 14px;
  background: linear-gradient(90deg, #5865F2, #8EA1E1);
  color: white;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 0 25px rgba(88,101,242,0.8);
  transition: 0.25s;
}

.success a:hover {
  transform: scale(1.08);
}

/* LOADER */
#loader {
  display: none;
  border: 4px solid rgba(255,255,255,0.1);
  border-top: 4px solid #00ff88;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  animation: spin 1s linear infinite;
  margin: 22px auto;
}

/* ANIMAZIONI */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; } }
@keyframes glow { from { text-shadow: 0 0 8px #00ff88; } to { text-shadow: 0 0 22px #00ffaa; } }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>

<body>

<div class="container">

  <div id="formBox">
    <h1>🏆 Thebes Cup</h1>
    <p class="subtitle">Modulo di iscrizione ufficiale</p>

    <form id="cupForm">
      <label>Nome reale</label>
      <input type="text" name="nome" required>

      <label>ID Epic</label>
      <input type="text" name="epic" required>

      <label>Nome Discord</label>
      <input type="text" name="discord" placeholder="Esempio: @Player" required>

      <label>Età (min 13)</label>
      <input type="number" name="eta" min="13" required>

      <label>Console principale</label>
      <select name="console">
        <option>PC</option>
        <option>PlayStation</option>
        <option>Xbox</option>
        <option>Switch</option>
      </select>

      <label>Livello abilità</label>
      <select name="livello">
        <option>Principiante</option>
        <option>Intermedio</option>
        <option>Pro / Expert</option>
      </select>

      <div class="box">
        <strong>📸 Opzioni streaming</strong>
        <label>Comparire in live <input type="checkbox" name="live"></label>
        <label>Condivisione schermo <input type="checkbox" name="schermo"></label>
      </div>

      <label>Firma digitale</label>
      <input type="text" name="firma" placeholder="ACCETTO REGOLE" required>

      <button type="submit">🚀 Invia iscrizione</button>
    </form>

    <div id="loader"></div>
    <p class="footer">© Reborns System</p>
  </div>

  <div id="successBox" class="success">
    <div class="success-icon">✅</div>
    <h2>Iscrizione riuscita!</h2>
    <p>La tua iscrizione è stata inviata correttamente.</p>
    <p>Unisciti al Discord per info e comunicazioni.</p>
    <a href="https://discord.gg/qHGQFFZ6T9" target="_blank">👉 Entra nel Discord</a>
  </div>

</div>

<script>
const webhookURL = "https://discord.com/api/webhooks/1468302083903193140/YGowAnHpay9WIuZtFhdYVeSmwkhaaGYnVJQptvPz0lOQqErUpEyttb3EaebmXw_w0E7L";

document.getElementById("cupForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const f = new FormData(e.target);

  if (f.get("firma").toUpperCase() !== "ACCETTO REGOLE") {
    alert('Devi scrivere "ACCETTO REGOLE"');
    return;
  }

  const epicID = f.get("epic");
  const invii = JSON.parse(localStorage.getItem("inviiEpic") || "[]");

  if (invii.includes(epicID)) {
    alert("Hai già inviato un'iscrizione con questo Epic ID!");
    return;
  }

  document.getElementById("loader").style.display = "block";

  const embed = {
    title: "🏆 NUOVA ISCRIZIONE – THEBES CUP",
    color: 0x00ff88,
    fields: [
      { name: "👤 Giocatore", value: `**Nome:** ${f.get("nome")}\n**Epic ID:** ${epicID}\n**Età:** ${f.get("eta")}\n**Discord:** ${f.get("discord")}` },
      { name: "🎮 Piattaforma", value: `**Console:** ${f.get("console")}\n**Livello:** ${f.get("livello")}` },
      { name: "📸 Streaming", value: `${f.get("live") ? "🟢 Live consentita" : "🔴 Live non consentita"}\n${f.get("schermo") ? "🟢 Condivisione schermo consentita" : "🔴 Condivisione schermo non consentita"}` },
      { name: "✍️ Firma digitale", value: `\`${f.get("firma")}\`` }
    ],
    timestamp: new Date()
  };

  fetch(webhookURL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ embeds: [embed] })
  }).then(() => {
    invii.push(epicID);
    localStorage.setItem("inviiEpic", JSON.stringify(invii));
    document.getElementById("formBox").style.display = "none";
    document.getElementById("successBox").style.display = "block";
    document.getElementById("loader").style.display = "none";
  });
});
</script>

</body>
</html>
